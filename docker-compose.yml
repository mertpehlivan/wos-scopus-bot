# WoS/Scopus Bot — Local Development Database
# Note: This is NOT for production deployment. The full application stack is deployed
# natively on Windows Server using scripts/install-windows-server-2022.ps1.
# This file is used strictly for spinning up a local PostgreSQL 16 instance during development.

version: '3.8'

services:
  postgres:
    image: postgres:16-alpine
    container_name: article-broker-postgres
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: password
      POSTGRES_DB: article_broker
    ports:
      - "5433:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -U postgres -d article_broker" ]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  postgres_data:
