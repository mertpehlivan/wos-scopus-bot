spring:
  application:
    name: article-task-broker
  servlet:
    multipart:
      max-file-size: 50MB
      max-request-size: 50MB
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5433/article_broker}
    username: ${DB_USER:postgres}
    password: ${DB_PASSWORD:password}
    driver-class-name: org.postgresql.Driver
    hikari:
      maximum-pool-size: 10
      minimum-idle: 2
  jpa:
    hibernate:
      ddl-auto: update
    show-sql: false
    properties:
      hibernate:
        format_sql: true
        default_schema: public
        jdbc:
          batch_size: 25
    open-in-view: false

# Timeout: PROCESSING -> PENDING after this many minutes
broker:
  processing-timeout-minutes: 120
  api-key: ${BROKER_API_KEY:change-me-in-production}
  # URL of the main backend system that receives Citation Report data
  backend-url: ${BACKEND_URL:http://localhost:8080}
  # Shared secret used by the broker when calling the main backend's
  # /api/v1/internal/apply-sync endpoint. Defaults to broker.api-key.
  backend-api-key: ${BACKEND_API_KEY:${BROKER_API_KEY:change-me-in-production}}
  # Multi-tenant allowlist: comma-separated base URLs of the main backends
  # permitted to open sync requests (e.g.
  # https://rdlsis.sisli.edu.tr,https://rawdatalibrary.net). Each request
  # carries its own callback URL + token; the broker validates the URL against
  # this list before storing it and posting approved data back. Empty = no
  # restriction (single-tenant / back-compat).
  allowed-backend-urls: ${BROKER_ALLOWED_BACKEND_URLS:}
  # Multi-tenant registry (JSON array). Each entry:
  #   {"id":"sisli","name":"Şişli Üniv.","url":"https://rdlsis.sisli.edu.tr",
  #    "inboundKey":"<that backend's X-Api-Key>","callbackToken":"<its X-Internal-Key>"}
  # Empty = single-tenant mode (no behaviour change). Enables per-tenant inbound
  # keys + operator manual-create routing + researcher-search routing. Registry
  # URLs are implicitly allowed as callback targets (see allowed-backend-urls).
  tenants-json: ${BROKER_TENANTS_JSON:[]}
  # Chrome extension origin for CORS (set to exact extension ID in production)
  # Example: BROKER_EXTENSION_ORIGIN=chrome-extension://abcdefghijklmnopabcdefghijklmnop
  extension-origin: ${BROKER_EXTENSION_ORIGIN:chrome-extension://*}
  # Operator panel SLA — how long the operator has to approve/reject a request.
  sla-review-hours: ${SLA_REVIEW_HOURS:24}
  # Secret used to sign operator panel session tokens (HMAC-SHA256).
  operator-token-secret: ${OPERATOR_TOKEN_SECRET:${BROKER_API_KEY:change-me-in-production}}
  # Default operator account created at first startup. CHANGE in production.
  default-operator:
    username: ${OPERATOR_DEFAULT_USERNAME:admin}
    password: ${OPERATOR_DEFAULT_PASSWORD:admin}

server:
  port: 8081
  tomcat:
    max-http-post-size: 50MB

logging:
  level:
    com.academic.broker: INFO
    org.hibernate.SQL: WARN
